# ===== Database (Supabase) =====
spring.datasource.url=jdbc:postgresql://aws-0-ap-southeast-1.pooler.supabase.com:6543/postgres?prepareThreshold=0&preparedStatementCacheQueries=0
spring.datasource.username=postgres.smflxvrjipxixrsltrum
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===== JPA =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ===== JWT =====
jwt.secret=${JWT_SECRET}
jwt.expiration=604800000

# ===== Groq / Spring AI =====
spring.ai.openai.api-key=${GROQ_API_KEY}
spring.ai.openai.base-url=https://api.groq.com/openai/v1
spring.ai.openai.chat.options.model=openai/gpt-oss-120b
spring.ai.openai.chat.options.temperature=0.7



# ===== Multipart =====
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ===== Server =====
server.port=${PORT:8080}



# Expose only health endpoint ? no sensitive info
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
management.health.defaults.enabled=true
management.endpoint.health.probes.enabled=true


# Enable liveness/readiness probes
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.health.mail.enabled=false

# Remove all spring.mail.* properties and replace with:
resend.api.key=${RESEND_API_KEY}
resend.from.email=onboarding@resend.dev