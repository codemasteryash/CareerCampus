# ===== Database (Supabase) =====
spring.datasource.url=jdbc:postgresql://aws-0-ap-southeast-1.pooler.supabase.com:6543/postgres?prepareThreshold=0&preparedStatementCacheQueries=0
spring.datasource.username=postgres.smflxvrjipxixrsltrum
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===== JPA =====
#spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# ===== JWT =====
jwt.secret=${JWT_SECRET}
jwt.expiration=604800000

# ===== Groq / Spring AI =====
spring.ai.openai.api-key=${GROQ_API_KEY}
spring.ai.openai.base-url=https://api.groq.com/openai/v1
spring.ai.openai.chat.options.model=llama-3.3-70b-versatile
spring.ai.openai.chat.options.temperature=0.7

# ===== Mail =====
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ===== Multipart =====
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ===== Server =====
server.port=${PORT:8080}

spring.main.lazy-initialization=true
# Skip schema validation on startup ? Hibernate won't scan all tables
spring.jpa.hibernate.ddl-auto=none

# Don't check if entities match DB schema on startup
spring.jpa.properties.hibernate.hbm2ddl.auto=none

# Reduce connection pool size ? less connections to establish on startup
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.initialization-fail-timeout=0
# Disable unused Spring Boot features on prod
spring.jmx.enabled=false
spring.mvc.pathmatch.use-suffix-pattern=false
# Expose only health endpoint ? no sensitive info
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never